name: TurnOva Driver Standalone APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        working-directory: src/mobile/driver-app
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        working-directory: src/mobile/driver-app
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK with embedded JS
        working-directory: src/mobile/driver-app/android
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Verify installable release APK and bundled JavaScript
        shell: bash
        working-directory: src/mobile/driver-app
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -l "$apk" | grep -F 'assets/index.android.bundle'
          unzip -l "$apk" | grep -F 'AndroidManifest.xml'
          echo "Release APK and embedded JavaScript verified"
      - name: Upload standalone driver APK
        uses: actions/upload-artifact@v4
        with:
          name: turnova-driver-standalone-release-apk
          path: src/mobile/driver-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
