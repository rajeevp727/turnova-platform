name: TurnOva Android Standalone APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/mobile/**"
      - ".github/workflows/android-standalone-apk.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: turnova-android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-standalone-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: [driver-app, rider-app]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/mobile/${{ matrix.app }}/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install app dependencies
        working-directory: src/mobile/${{ matrix.app }}
        run: npm install --prefer-offline --no-fund --audit=false
      - name: Generate Android native project
        working-directory: src/mobile/${{ matrix.app }}
        run: npx expo prebuild --platform android --no-install --clean
      - name: Install checksum-verified Gradle 8.14.3
        shell: bash
        run: |
          set -euo pipefail
          version=8.14.3
          checksum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
          dist_root="$HOME/.gradle/turnova-distributions"
          gradle_home="$dist_root/gradle-$version"
          if [[ ! -x "$gradle_home/bin/gradle" ]]; then
            mkdir -p "$dist_root"
            archive="$RUNNER_TEMP/gradle-$version-bin.zip"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 600 "https://downloads.gradle.org/distributions/gradle-$version-bin.zip" --output "$archive"
            echo "$checksum  $archive" | sha256sum --check --status
            unzip -q "$archive" -d "$dist_root"
            rm -f "$archive"
          fi
          "$gradle_home/bin/gradle" --version
      - name: Assemble standalone release APK
        working-directory: src/mobile/${{ matrix.app }}/android
        run: "$HOME/.gradle/turnova-distributions/gradle-8.14.3/bin/gradle" --no-daemon --stacktrace assembleRelease
      - name: Verify standalone APK and embedded JavaScript
        working-directory: src/mobile/${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -F 'assets/index.android.bundle' >/dev/null
          echo "Verified standalone APK with embedded JavaScript: $apk"
      - uses: actions/upload-artifact@v6
        with:
          name: turnova-${{ matrix.app }}-standalone-apk
          path: src/mobile/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
