name: TurnOva CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/backend/TurnOva/TurnOva.sln
      - run: dotnet build src/backend/TurnOva/TurnOva.sln --configuration Release --no-restore
      - name: Run backend test project
        run: dotnet test src/backend/TurnOva/TurnOva.Tests/TurnOva.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=turnova-tests.trx" --results-directory "$RUNNER_TEMP/turnova-test-results"
      - name: Verify backend tests actually executed
        run: |
          python3 - "$RUNNER_TEMP/turnova-test-results/turnova-tests.trx" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          root = ET.parse(path).getroot()
          namespace = {"trx": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          counters = root.find(".//trx:Counters", namespace)
          if counters is None:
              raise SystemExit("TRX results did not contain test counters.")
          total = int(counters.get("total", "0"))
          executed = int(counters.get("executed", "0"))
          failed = int(counters.get("failed", "0"))
          if total < 1 or executed < 1:
              raise SystemExit(f"Backend test project executed no tests (total={total}, executed={executed}).")
          if failed:
              raise SystemExit(f"Backend test suite reported {failed} failure(s).")
          print(f"Backend tests executed: {executed}/{total}; failures: {failed}.")
          PY
      - name: Publish API without containers
        run: dotnet publish src/backend/TurnOva/TurnOva.API/TurnOva.API.csproj --configuration Release --no-restore --output "$RUNNER_TEMP/turnova-api"
      - name: Verify publish artifact
        run: test -s "$RUNNER_TEMP/turnova-api/TurnOva.API.dll"
      - uses: actions/upload-artifact@v6
        with:
          name: turnova-api-publish
          path: ${{ runner.temp }}/turnova-api/
          if-no-files-found: error

  mobile:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [driver-app, rider-app]
    defaults:
      run:
        working-directory: src/mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/mobile/${{ matrix.app }}/package.json
      - run: npm install
      - run: npx expo config --type public
      - run: npm run typecheck
      - name: Verify Metro can see shared mobile modules
        run: node -e 'const fs = require("node:fs"); const path = require("node:path"); const config = require("./metro.config.js"); const shared = path.resolve(process.cwd(), "../shared"); if (!config.watchFolders.includes(shared) || !fs.existsSync(path.join(shared, "refreshCoordinator.js"))) throw new Error("Metro shared workspace or refresh module is missing");'
      - name: Export Android production JavaScript bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/turnova-${{ matrix.app }}-android"
      - name: Verify Android production bundle
        run: test -s "$RUNNER_TEMP/turnova-${{ matrix.app }}-android/metadata.json"
      - name: Export iOS production JavaScript bundle
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/turnova-${{ matrix.app }}-ios"
      - name: Verify iOS production bundle
        run: test -s "$RUNNER_TEMP/turnova-${{ matrix.app }}-ios/metadata.json"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app }}-production-js-bundles
          path: |
            ${{ runner.temp }}/turnova-${{ matrix.app }}-android/
            ${{ runner.temp }}/turnova-${{ matrix.app }}-ios/
          if-no-files-found: error

  native-android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [driver-app, rider-app]
    defaults:
      run:
        working-directory: src/mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/mobile/${{ matrix.app }}/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Configure Gradle wrapper download timeout
        working-directory: src/mobile/${{ matrix.app }}/android
        run: |
          wrapper_file=gradle/wrapper/gradle-wrapper.properties
          if grep -q '^networkTimeout=' "$wrapper_file"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$wrapper_file"
          else
            printf '\\nnetworkTimeout=120000\\n' >> "$wrapper_file"
          fi
      - name: Compile Android debug APK with transient distribution-download retry
        working-directory: src/mobile/${{ matrix.app }}/android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/gradle-${{ matrix.app }}-$attempt.log"
            set +e
            ./gradlew --no-daemon assembleDebug 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if ! grep -Eq 'Server returned HTTP response code: 5[0-9]{2}|SocketTimeoutException|Downloading from .* failed: timeout' "$log"; then
              echo "Gradle failed for a non-retryable reason; not retrying."
              exit "$status"
            fi
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 15))
              echo "Gradle distribution download failed transiently; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "Gradle distribution download failed after three attempts."
          exit 1
      - name: Verify Android APK artifact
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app }}-android-native-debug-apk
          path: src/mobile/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  native-ios:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        app: [driver-app, rider-app]
    defaults:
      run:
        working-directory: src/mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/mobile/${{ matrix.app }}/package.json
      - run: npm install
      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios
      - name: Compile unsigned iOS Simulator app
        env:
          APP_NAME: ${{ matrix.app }}
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          PROJECT="$(find ios -maxdepth 1 -type d -name '*.xcodeproj' -print -quit)"
          test -n "$WORKSPACE"
          test -n "$PROJECT"
          case "$PROJECT" in
            */Pods/*) echo "Refusing to build CocoaPods aggregate project: $PROJECT" >&2; exit 1 ;;
          esac
          PROJECT_NAME="$(basename "$PROJECT" .xcodeproj)"
          WORKSPACE_NAME="$(basename "$WORKSPACE" .xcworkspace)"
          test "$WORKSPACE_NAME" = "$PROJECT_NAME"
          xcodebuild -list -json -project "$PROJECT" > "$RUNNER_TEMP/xcode-project.json"
          SCHEME="$(python3 - "$RUNNER_TEMP/xcode-project.json" "$PROJECT_NAME" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              project = json.load(stream).get("project", {})
          schemes = project.get("schemes", [])
          preferred = sys.argv[2]
          if preferred in schemes:
              print(preferred)
          elif len(schemes) == 1:
              print(schemes[0])
          else:
              raise SystemExit(f"Expected app scheme {preferred!r}; found {schemes!r}")
          PY
          )"
          case "$APP_NAME" in
            driver-app) BUNDLE_ID="com.turnova.driver" ;;
            rider-app) BUNDLE_ID="com.turnova.rider" ;;
            *) echo "Unknown app: $APP_NAME" >&2; exit 1 ;;
          esac
          DERIVED_DATA="$RUNNER_TEMP/turnova-$APP_NAME-ios"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            build
          APP_BUNDLE="$(find "$DERIVED_DATA/Build/Products/Release-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_BUNDLE"
          test -d "$APP_BUNDLE"
          echo "Unsigned simulator build produced: $APP_BUNDLE"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app }}-ios-simulator-app
          path: ${{ runner.temp }}/turnova-${{ matrix.app }}-ios/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error

  mobile-auth-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test shared mobile state and refresh helpers
        run: node --test src/mobile/shared/*.test.cjs
