name: TurnOva CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/backend/TurnOva/TurnOva.sln
      - run: dotnet build src/backend/TurnOva/TurnOva.sln --configuration Release --no-restore
      - run: dotnet test src/backend/TurnOva/TurnOva.sln --configuration Release --no-build

  mobile:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [driver-app, rider-app]
    defaults:
      run:
        working-directory: src/mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/mobile/${{ matrix.app }}/package.json
      - run: npm install
      - run: npm run typecheck
