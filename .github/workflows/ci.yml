name: TurnOva CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Keep only the newest CI run for each PR; stale queued matrices waste runner capacity.
concurrency:
  group: turnova-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Enforce native-only hosting policy
        run: bash scripts/test-native-only-hosting.sh
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/backend/TurnOva/**/*.csproj', 'src/backend/TurnOva/**/*.props', 'src/backend/TurnOva/**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: dotnet restore src/backend/TurnOva/TurnOva.sln
      - run: dotnet build src/backend/TurnOva/TurnOva.sln --configuration Release --no-restore
      - name: Run backend test project
        run: dotnet test src/backend/TurnOva/TurnOva.Tests/TurnOva.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=turnova-tests.trx" --results-directory "$RUNNER_TEMP/turnova-test-results"
      - name: Verify backend tests actually executed
        run: |
          python3 - "$RUNNER_TEMP/turnova-test-results/turnova-tests.trx" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          root = ET.parse(path).getroot()
          namespace = {"trx": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          counters = root.find(".//trx:Counters", namespace)
          if counters is None:
              raise SystemExit("TRX results did not contain test counters.")
          total = int(counters.get("total", "0"))
          executed = int(counters.get("executed", "0"))
          failed = int(counters.get("failed", "0"))
          if total < 1 or executed < 1:
              raise SystemExit(f"Backend test project executed no tests (total={total}, executed={executed}).")
          if failed:
              raise SystemExit(f"Backend test suite reported {failed} failure(s).")
          print(f"Backend tests executed: {executed}/{total}; failures: {failed}.")
          PY
      - name: Restore API for Linux x64 publish
        run: dotnet restore src/backend/TurnOva/TurnOva.API/TurnOva.API.csproj --runtime linux-x64
      - name: Publish API without containers
        run: dotnet publish src/backend/TurnOva/TurnOva.API/TurnOva.API.csproj --configuration Release --runtime linux-x64 --self-contained false --no-restore --output "$RUNNER_TEMP/turnova-api"
      - name: Verify publish script syntax
        run: |
          bash -n scripts/verify-api-publish.sh
          bash -n scripts/test-api-publish-verifier.sh
      - name: Test native publish verifier
        run: bash scripts/test-api-publish-verifier.sh
      - name: Verify publish artifact
        run: bash scripts/verify-api-publish.sh "$RUNNER_TEMP/turnova-api"
      - uses: actions/upload-artifact@v6
        with:
          name: turnova-api-publish
          path: ${{ runner.temp }}/turnova-api/
          if-no-files-found: error

  mobile:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [driver-app, rider-app]
    defaults:
      run:
        working-directory: src/mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/mobile/${{ matrix.app }}/package.json

      - run: npm install --prefer-offline --no-fund --audit=false
      - name: Validate release configuration and report external gates
        run: node ../../../scripts/release-preflight.cjs --app-dir "$PWD" --output "$RUNNER_TEMP/${{ matrix.app }}-release-readiness.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.app }}-release-readiness
          path: ${{ runner.temp }}/${{ matrix.app }}-release-readiness.json
          if-no-files-found: warn
      - name: Trace audited dependency resolution
        run: npm ls image-size postcss sharp --all || true
      - name: Upload generated npm lockfile for review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app }}-generated-lockfile
          path: src/mobile/${{ matrix.app }}/package-lock.json
          if-no-files-found: error
      - name: Audit mobile dependency tree
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/npm-audit-${{ matrix.app }}.json"
          set +e
          npm audit --json > "$report"
          audit_status=$?
          set -e
          python3 - "$report" "$audit_status" <<'PY'
          import json
          import sys

          path, audit_status = sys.argv[1], int(sys.argv[2])
          with open(path, encoding="utf-8") as stream:
              report = json.load(stream)
          metadata = report.get("metadata", {}).get("vulnerabilities", {})
          critical = int(metadata.get("critical", 0))
          high = int(metadata.get("high", 0))
          print(
              "npm audit: "
              f"{metadata.get('total', 0)} total; "
              f"{critical} critical; {high} high; "
              f"{metadata.get('moderate', 0)} moderate; "
              f"{metadata.get('low', 0)} low."
          )
          for name, item in sorted(report.get("vulnerabilities", {}).items()):
              if item.get("severity") in {"critical", "high"}:
                  via = item.get("via", [])
                  titles = [
                      entry.get("title", entry.get("name", "unknown"))
                      if isinstance(entry, dict) else entry
                      for entry in via
                  ]
                  print(
                      f"- {name}: {item.get('severity')}; "
                      f"direct={item.get('isDirect')}; "
                      f"range={item.get('range')}; "
                      f"fixAvailable={item.get('fixAvailable')}; "
                      f"advisories={titles}"
                  )
          if critical or high or audit_status not in (0, 1):
              raise SystemExit("Dependency audit failed: resolve high/critical findings or audit execution errors.")
          PY
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app }}-npm-audit
          path: ${{ runner.temp }}/npm-audit-${{ matrix.app }}.json
          if-no-files-found: warn
      - run: npx expo config --type public
      - run: npm run typecheck
      - name: Verify Metro can see shared mobile modules
        run: node -e 'const fs = require("node:fs"); const path = require("node:path"); const config = require("./metro.config.js"); const shared = path.resolve(process.cwd(), "../shared"); if (!config.watchFolders.includes(shared) || !fs.existsSync(path.join(shared, "refreshCoordinator.js"))) throw new Error("Metro shared workspace or refresh module is missing");'
      - name: Export Android production JavaScript bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/turnova-${{ matrix.app }}-android"
      - name: Verify Android production bundle
        run: test -s "$RUNNER_TEMP/turnova-${{ matrix.app }}-android/metadata.json"
      - name: Export iOS production JavaScript bundle
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/turnova-${{ matrix.app }}-ios"
      - name: Verify iOS production bundle
        run: test -s "$RUNNER_TEMP/turnova-${{ matrix.app }}-ios/metadata.json"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app }}-production-js-bundles
          path: |
            ${{ runner.temp }}/turnova-${{ matrix.app }}-android/
            ${{ runner.temp }}/turnova-${{ matrix.app }}-ios/
          if-no-files-found: error

  # Release APKs are built and bundle-verified in the same native Android matrix.
  native-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [driver-app, rider-app]
    defaults:
      run:
        working-directory: src/mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/mobile/${{ matrix.app }}/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - run: npm install --prefer-offline --no-fund --audit=false
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-deps-${{ matrix.app }}-${{ hashFiles(format('src/mobile/{0}/package.json', matrix.app), format('src/mobile/{0}/android/**/*.gradle*', matrix.app), format('src/mobile/{0}/android/gradle/wrapper/gradle-wrapper.properties', matrix.app)) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-deps-${{ matrix.app }}-
      - name: Cache Gradle 8.14.3 distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/turnova-distributions/gradle-8.14.3
          key: ${{ runner.os }}-gradle-8.14.3-bin-bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
      - name: Install checksum-verified Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          version=8.14.3
          checksum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
          dist_root="$HOME/.gradle/turnova-distributions"
          gradle_home="$dist_root/gradle-$version"
          if [[ ! -x "$gradle_home/bin/gradle" ]]; then
            mkdir -p "$dist_root"
            archive="$RUNNER_TEMP/gradle-$version-bin.zip"
            rm -f "$archive"
            urls=(
              "https://downloads.gradle.org/distributions/gradle-$version-bin.zip"
              "https://repo.huaweicloud.com/gradle/gradle-$version-bin.zip"
            )
            downloaded=false
            for url in "${urls[@]}"; do
              echo "Downloading Gradle $version from $url"
              if curl --fail --location --silent --show-error \
                --retry 5 --retry-all-errors --retry-delay 10 \
                --connect-timeout 30 --max-time 600 \
                "$url" --output "$archive"; then
                downloaded=true
                break
              fi
              rm -f "$archive"
            done
            if [[ "$downloaded" != true ]]; then
              echo "Unable to download Gradle $version from official or fallback distribution hosts." >&2
              exit 1
            fi
            echo "$checksum  $archive" | sha256sum --check --status || {
              echo "Gradle distribution SHA-256 verification failed." >&2
              exit 1
            }
            unzip -q "$archive" -d "$dist_root"
            rm -f "$archive"
          fi
          "$gradle_home/bin/gradle" --version
      - name: Compile Android debug APK with transient dependency retry
        working-directory: src/mobile/${{ matrix.app }}/android
        shell: bash
        run: |
          set -euo pipefail
          gradle="$HOME/.gradle/turnova-distributions/gradle-8.14.3/bin/gradle"
          for attempt in 1 2 3 4 5; do
            log="$RUNNER_TEMP/gradle-build-${{ matrix.app }}-$attempt.log"
            set +e
            "$gradle" --no-daemon assembleDebug 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if ! grep -Eqi 'HTTP (response code: )?5[0-9]{2}|status code 5[0-9]{2}|Gateway Time-out|SocketTimeoutException|Read timed out|Could not GET .*timed out' "$log"; then
              echo "Gradle compilation failed for a non-transient reason; not retrying."
              exit "$status"
            fi
            if [[ "$attempt" -lt 5 ]]; then
              delay=$((attempt * 20))
              echo "Dependency repository returned a transient 5xx/timeout; retrying Gradle build in ${delay}s (attempt $((attempt + 1))/5)."
              sleep "$delay"
            fi
          done
          echo "Gradle build exhausted five attempts due to transient dependency repository failures."
          exit 1
      - name: Verify Android APK artifact
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app }}-android-native-debug-apk
          path: src/mobile/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Compile standalone Android release APK
        working-directory: src/mobile/${{ matrix.app }}/android
        run: '"$HOME/.gradle/turnova-distributions/gradle-8.14.3/bin/gradle" --no-daemon --stacktrace assembleRelease'
      - name: Verify standalone APK bundle and embedded package identity
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -F 'assets/index.android.bundle' >/dev/null
          expected_package="$(node -e 'process.stdout.write(require("./app.json").expo.android.package)')"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$aapt" && test -x "$aapt"
          python3 ../../../scripts/verify_native_app_identity.py android --apk "$apk" --expected-id "$expected_package" --aapt "$aapt"
          echo "Standalone release APK verified with embedded JavaScript and expected package identity."
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app }}-android-standalone-release-apk
          path: src/mobile/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  native-ios:
    runs-on: macos-15-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: [driver-app, rider-app]
    defaults:
      run:
        working-directory: src/mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/mobile/${{ matrix.app }}/package.json

      - run: npm install --prefer-offline --no-fund --audit=false
      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Cache CocoaPods dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-${{ runner.arch }}-pods-${{ matrix.app }}-${{ hashFiles(format('src/mobile/{0}/package.json', matrix.app), format('src/mobile/{0}/ios/Podfile', matrix.app)) }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pods-${{ matrix.app }}-
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios
      - name: Compile unsigned iOS Simulator app
        env:
          APP_NAME: ${{ matrix.app }}
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          PROJECT="$(find ios -maxdepth 1 -type d -name '*.xcodeproj' -print -quit)"
          test -n "$WORKSPACE"
          test -n "$PROJECT"
          case "$PROJECT" in
            */Pods/*) echo "Refusing to build CocoaPods aggregate project: $PROJECT" >&2; exit 1 ;;
          esac
          PROJECT_NAME="$(basename "$PROJECT" .xcodeproj)"
          WORKSPACE_NAME="$(basename "$WORKSPACE" .xcworkspace)"
          test "$WORKSPACE_NAME" = "$PROJECT_NAME"
          xcodebuild -list -json -project "$PROJECT" > "$RUNNER_TEMP/xcode-project.json"
          SCHEME="$(python3 - "$RUNNER_TEMP/xcode-project.json" "$PROJECT_NAME" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              project = json.load(stream).get("project", {})
          schemes = project.get("schemes", [])
          preferred = sys.argv[2]
          if preferred in schemes:
              print(preferred)
          elif len(schemes) == 1:
              print(schemes[0])
          else:
              raise SystemExit(f"Expected app scheme {preferred!r}; found {schemes!r}")
          PY
          )"
          case "$APP_NAME" in
            driver-app) BUNDLE_ID="com.turnova.driver" ;;
            rider-app) BUNDLE_ID="com.turnova.rider" ;;
            *) echo "Unknown app: $APP_NAME" >&2; exit 1 ;;
          esac
          DERIVED_DATA="$RUNNER_TEMP/turnova-$APP_NAME-ios"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            ARCHS="$(uname -m)" \
            ONLY_ACTIVE_ARCH=YES \
            build
          APP_BUNDLE="$(find "$DERIVED_DATA/Build/Products/Release-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_BUNDLE"
          test -d "$APP_BUNDLE"
          python3 ../../../scripts/verify_native_app_identity.py ios --info-plist "$APP_BUNDLE/Info.plist" --expected-id "$BUNDLE_ID"
          echo "Unsigned simulator build produced and identity-verified: $APP_BUNDLE"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app }}-ios-simulator-app
          path: ${{ runner.temp }}/turnova-${{ matrix.app }}-ios/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error

  android-emulator-smoke:
    needs: [native-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [driver-app, rider-app]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.app }}-android-standalone-release-apk
          path: ${{ runner.temp }}/turnova-${{ matrix.app }}-release
      - name: Install and launch standalone release APK in Android emulator
        env:
          APP_NAME: ${{ matrix.app }}
        run: |
          set -euo pipefail
          apk="$(find "$RUNNER_TEMP/turnova-$APP_NAME-release" -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          case "$APP_NAME" in
            rider-app) package_id="com.turnova.rider" ;;
            driver-app) package_id="com.turnova.driver" ;;
            *) echo "Unknown app: $APP_NAME" >&2; exit 1 ;;
          esac
          bash scripts/android-emulator-smoke.sh --apk "$apk" --expected-id "$package_id" --output-dir "$RUNNER_TEMP/turnova-$APP_NAME-smoke"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.app }}-android-emulator-smoke
          path: ${{ runner.temp }}/turnova-${{ matrix.app }}-smoke/
          if-no-files-found: warn
          retention-days: 14

  ios-simulator-smoke:
    needs: [native-ios]
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [driver-app, rider-app]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.app }}-ios-simulator-app
          path: ${{ runner.temp }}/turnova-${{ matrix.app }}-simulator-app
      - name: Install and launch unsigned app in iOS Simulator
        env:
          APP_NAME: ${{ matrix.app }}
        run: |
          set -euo pipefail
          app_bundle="$(find "$RUNNER_TEMP/turnova-$APP_NAME-simulator-app" -type d -name '*.app' -print -quit)"
          test -n "$app_bundle"
          case "$APP_NAME" in
            rider-app) bundle_id="com.turnova.rider" ;;
            driver-app) bundle_id="com.turnova.driver" ;;
            *) echo "Unknown app: $APP_NAME" >&2; exit 1 ;;
          esac
          bash scripts/ios-simulator-smoke.sh --app "$app_bundle" --expected-id "$bundle_id" --output-dir "$RUNNER_TEMP/turnova-$APP_NAME-smoke"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.app }}-ios-simulator-smoke
          path: ${{ runner.temp }}/turnova-${{ matrix.app }}-smoke/
          if-no-files-found: warn
          retention-days: 14

  mobile-auth-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions workflow YAML syntax
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/ci.yml")'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate native launch smoke script syntax
        run: bash -n scripts/android-emulator-smoke.sh scripts/ios-simulator-smoke.sh
      - name: Test shared mobile state and refresh helpers
        run: node --test src/mobile/shared/*.test.cjs
      - name: Test deterministic native artifact identity verifier
        run: python3 -m unittest discover -s scripts/tests -p 'test_verify_native_app_identity.py' -v
