name: Weekly TurnOva Build

on:
  schedule:
    # Every Monday at 08:00 India Standard Time (02:30 UTC)
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-turnova-build
  cancel-in-progress: false

jobs:
  build:
    name: Restore and build TurnOva
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore src/backend/TurnOva/TurnOva.sln

      - name: Build solution
        run: dotnet build src/backend/TurnOva/TurnOva.sln --no-restore --configuration Release
