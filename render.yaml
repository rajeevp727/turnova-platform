# Render Blueprint — placeholders only. Review region/plan before provisioning.
services:
  - type: web
    name: turnova-api
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./infrastructure/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: CosmosDb__Endpoint
        sync: false
      - key: CosmosDb__Key
        sync: false
      - key: CosmosDb__DatabaseName
        value: TurnOvaDb
      - key: TriSend__BaseUrl
        sync: false
      - key: Auth__Jwt__Issuer
        sync: false
      - key: Auth__Jwt__Audience
        sync: false
      - key: Auth__Jwt__SigningKey
        sync: false
